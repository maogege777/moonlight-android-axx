name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 硬性前提：moonlight-common-c 内含嵌套的 enet / nanors 子模块，
          # 不递归检出会导致 NDK 编译失败
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.5.1 要求 JDK 17+（Gradle 8.7 由项目 wrapper 提供）
          java-version: 17

      - name: Locate pre-installed Android SDK
        # ubuntu runner 自带 Android SDK，无需 setup-android（该 action 默认下载的
        # cmdline-tools 版本已失效，容易直接失败）
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME}"
          CAND=""
          for d in "$ANDROID_HOME/cmdline-tools/latest" \
                   "$ANDROID_HOME/cmdline-tools/current" \
                   "$ANDROID_HOME/cmdline-tools"; do
            if [ -x "$d/bin/sdkmanager" ]; then CAND="$d/bin/sdkmanager"; break; fi
          done
          if [ -z "$CAND" ]; then
            echo "ERROR: sdkmanager not found under ANDROID_HOME"
            ls -R "$ANDROID_HOME" || true
            exit 1
          fi
          echo "SDKMANAGER=$CAND"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          # 必须用 >> 追加：tee / > 会截断 $GITHUB_ENV，把前面写入的变量全部抹掉
          echo "SDKMANAGER=$CAND" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install required SDK components
        # 版本必须与 app/build.gradle 的 compileSdk / ndkVersion 逐字对应
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;27.0.12077973"
          "$SDKMANAGER" --list_installed 2>/dev/null | grep -E 'platforms;android-34|ndk;27|build-tools;34' || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build nonRoot debug APK
        # nonRootDebug 得到 com.limelight.debug，可与官方 Moonlight 共存安装，便于 A/B 对比测试
        run: ./gradlew --no-daemon assembleNonRootDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-multitouch-fix-debug-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
