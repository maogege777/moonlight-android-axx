name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 硬性前提：moonlight-common-c 内含嵌套的 enet / nanors 子模块，
          # 不递归检出会导致 NDK 编译失败
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.5.1 要求 JDK 17+
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        # 版本必须与 app/build.gradle 的 compileSdk / ndkVersion 逐字对应
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "ndk;27.0.12077973"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build nonRoot debug APK
        # nonRootDebug 得到 com.limelight.debug，可与官方 Moonlight 共存安装，便于 A/B 对比测试
        run: ./gradlew --no-daemon assembleNonRootDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-multitouch-fix-debug-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
